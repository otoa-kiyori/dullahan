<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dullahan Privacy Tests</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Courier New', monospace; font-size: 12px;
    padding: 10px; overflow-y: scroll;
}
h1 { color: #4fc3f7; font-size: 1.05em; margin-bottom: 8px; letter-spacing: 1px; }
.summary {
    display: flex; align-items: center; gap: 10px;
    background: #16213e; padding: 7px 10px; border-radius: 4px;
    margin-bottom: 10px; border: 1px solid #1565c0;
}
.score { font-size: 1.25em; font-weight: bold; min-width: 72px; }
.bar { flex: 1; height: 8px; background: #2a2a3e; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#2e7d32,#66bb6a); transition: width .35s; border-radius: 4px; }
.lbl { color: #90a4ae; font-size: .82em; min-width: 90px; text-align: right; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: #0d2550; position: sticky; top: 0; z-index: 1; }
th { padding: 4px 7px; text-align: left; color: #90caf9; font-weight: normal; border-bottom: 2px solid #1565c0; white-space: nowrap; }
td { padding: 3px 7px; border-bottom: 1px solid #12122a; vertical-align: middle; }
tr.pass td { background: rgba(56,142,60,.10); }
tr.fail td { background: rgba(211,47,47,.13); }
tr.pend td { background: rgba(245,127,23,.07); }
tr.info td { background: rgba(21,101,192,.07); }
.badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-weight: bold; font-size: .82em; min-width: 42px; text-align: center;
}
.badge.pass { background:#1b5e20; color:#a5d6a7; }
.badge.fail { background:#b71c1c; color:#ffcdd2; }
.badge.pend { background:#424242; color:#ffd54f; }
.badge.info { background:#0d47a1; color:#90caf9; }
.cat  { color: #80cbc4; white-space: nowrap; }
.exp  { color: #78909c; }
.act  { font-weight: bold; }
.pv   { color: #a5d6a7; }
.fv   { color: #ef9a9a; }
.wv   { color: #ffd54f; }
</style>
</head>
<body>
<h1>&#x1F512; DULLAHAN PRIVACY TESTS</h1>
<div class="summary">
    <span id="score" class="score" style="color:#90a4ae">0 / 0</span>
    <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    <span id="lbl" class="lbl">Running&hellip;</span>
</div>
<table>
    <thead><tr>
        <th style="width:52px">Status</th>
        <th style="width:80px">Category</th>
        <th>Test</th>
        <th style="width:140px">Expected</th>
        <th>Actual</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
</table>

<script>
'use strict';
// ── data store ─────────────────────────────────────────────────────────────
// key → { cat, label, expected, actual, state: 'pass'|'fail'|'pend'|'info' }
const D = {};

function recount() {
    let p = 0, f = 0, t = 0;
    for (const k in D) {
        const s = D[k].state;
        if (s === 'pass') { p++; t++; }
        else if (s === 'fail') { f++; t++; }
        else if (s === 'pend') { t++; }
    }
    const scoreEl = document.getElementById('score');
    scoreEl.textContent = p + ' / ' + t;
    scoreEl.style.color = (t > 0 && f === 0) ? '#66bb6a' : '#ef5350';
    document.getElementById('bar-fill').style.width = (t > 0 ? (p / t * 100) : 0) + '%';
    const rem = t - p - f;
    document.getElementById('lbl').textContent =
        rem > 0 ? rem + ' pending\u2026' : (f === 0 ? 'All PASS \u2713' : f + ' FAIL \u2717');
}

function renderRow(key) {
    const r = D[key];
    const tbody = document.getElementById('tbody');
    let tr = document.getElementById('tr-' + key);
    if (!tr) {
        tr = document.createElement('tr');
        tr.id = 'tr-' + key;
        tbody.appendChild(tr);
    }
    tr.className = r.state;
    const badge =
        r.state === 'pass' ? '<span class="badge pass">&#x2705; PASS</span>' :
        r.state === 'fail' ? '<span class="badge fail">&#x274C; FAIL</span>' :
        r.state === 'pend' ? '<span class="badge pend">&#x23F3; WAIT</span>' :
                             '<span class="badge info">&#x2139; INFO</span>';
    const actCls = r.state === 'pass' ? 'pv' : r.state === 'fail' ? 'fv' : r.state === 'pend' ? 'wv' : '';
    tr.innerHTML =
        '<td>' + badge + '</td>' +
        '<td class="cat">' + r.cat + '</td>' +
        '<td>' + r.label + '</td>' +
        '<td class="exp">' + r.expected + '</td>' +
        '<td class="act ' + actCls + '">' + r.actual + '</td>';
}

function upsert(key, cat, label, expected, actual, state) {
    D[key] = { cat: cat, label: label, expected: expected, actual: String(actual), state: state };
    renderRow(key);
    recount();
    if (state !== 'pend' && state !== 'info') {
        console.log('PRIV|' + cat + '|' + key + '|' + expected + '|' + actual + '|' + (state === 'pass' ? 'PASS' : 'FAIL'));
    }
}

const rep  = (cat, key, label, exp, act, ok)  => upsert(key, cat, label, String(exp), act, ok ? 'pass' : 'fail');
const pend = (cat, key, label, exp)           => upsert(key, cat, label, String(exp), '\u2026', 'pend');
const info = (cat, key, label, val)           => upsert(key, cat, label, '(info)', val, 'info');

// ── tests ──────────────────────────────────────────────────────────────────
async function runTests() {

    // Navigator: hardware
    rep('Navigator', 'hwConcurrency',  'hardwareConcurrency',    '2',     navigator.hardwareConcurrency,  navigator.hardwareConcurrency === 2);
    rep('Navigator', 'deviceMemory',   'deviceMemory',           '1',     navigator.deviceMemory,         navigator.deviceMemory === 1);
    rep('Navigator', 'maxTouchPoints', 'maxTouchPoints',         '0',     navigator.maxTouchPoints,       navigator.maxTouchPoints === 0);

    // Navigator: identity
    rep('Navigator', 'platform',       'platform',               'Win32', navigator.platform,             navigator.platform === 'Win32');
    rep('Navigator', 'pdfViewer',      'pdfViewerEnabled',       'false', navigator.pdfViewerEnabled,     navigator.pdfViewerEnabled === false);
    rep('Navigator', 'webdriver',      'webdriver',              'false', navigator.webdriver,            navigator.webdriver === false);

    // Navigator: plugins
    rep('Navigator', 'pluginsLen',     'plugins.length',         '0',     navigator.plugins.length,       navigator.plugins.length === 0);
    rep('Navigator', 'mimeTypesLen',   'mimeTypes.length',       '0',     navigator.mimeTypes.length,     navigator.mimeTypes.length === 0);
    rep('Navigator', 'connection',     'connection',             'undef', typeof navigator.connection,    typeof navigator.connection === 'undefined');

    // Screen
    rep('Screen', 'colorDepth', 'colorDepth', '24', screen.colorDepth, screen.colorDepth === 24);
    rep('Screen', 'pixelDepth', 'pixelDepth', '24', screen.pixelDepth, screen.pixelDepth === 24);

    // Canvas noise
    try {
        const c = document.createElement('canvas');
        c.width = 1; c.height = 1;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ff0000'; // fills (255, 0, 0, 255)
        ctx.fillRect(0, 0, 1, 1);
        const d = ctx.getImageData(0, 0, 1, 1).data;
        const noised = (d[0] !== 255 || d[1] !== 0 || d[2] !== 0 || d[3] !== 255);
        rep('Canvas', 'noiseActive', 'getImageData bit-flip', 'flipped',
            'rgba(' + d[0] + ',' + d[1] + ',' + d[2] + ',' + d[3] + ')', noised);
    } catch (e) { rep('Canvas', 'noiseActive', 'getImageData bit-flip', 'flipped', 'error', false); }

    // Fonts
    try {
        const r = document.fonts.check('16px Arial');
        rep('Fonts', 'fontsCheck', 'FontFaceSet.check()', 'false', r, r === false);
    } catch (e) { rep('Fonts', 'fontsCheck', 'FontFaceSet.check()', 'false', 'error', false); }

    try {
        const el = document.createElement('span');
        el.style.cssText = 'position:fixed;top:-9999px;font:20px Arial;white-space:nowrap';
        el.textContent = 'Dullahan Privacy';
        document.body.appendChild(el);
        const r1 = el.getBoundingClientRect();
        const r2 = el.getBoundingClientRect();
        document.body.removeChild(el);
        info('Fonts', 'metricsRaw', 'getBoundingClientRect().width', r1.width.toFixed(7) + 'px');
        rep('Fonts', 'metricsStable', 'BCR stable within session', 'r1===r2',
            r1.width === r2.width ? 'stable' : 'unstable', r1.width === r2.width);
    } catch (e) { rep('Fonts', 'metricsStable', 'BCR stable within session', 'stable', 'error', false); }

    // WebGL
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const R  = gl.getParameter(gl.RENDERER);
            const V  = gl.getParameter(gl.VENDOR);
            const UR = gl.getParameter(0x9246); // UNMASKED_RENDERER_WEBGL
            const UV = gl.getParameter(0x9245); // UNMASKED_VENDOR_WEBGL
            const dbg  = gl.getExtension('WEBGL_debug_renderer_info');
            const exts = gl.getSupportedExtensions() || [];
            rep('WebGL', 'renderer',     'gl.RENDERER',               'WebKit WebGL', R,  R  === 'WebKit WebGL');
            rep('WebGL', 'vendor',       'gl.VENDOR',                 'WebKit',        V,  V  === 'WebKit');
            rep('WebGL', 'unmaskedRend', 'UNMASKED_RENDERER (0x9246)','WebKit WebGL', UR, UR === 'WebKit WebGL');
            rep('WebGL', 'unmaskedVend', 'UNMASKED_VENDOR  (0x9245)', 'WebKit',        UV, UV === 'WebKit');
            rep('WebGL', 'dbgExtNull',   'getExtension(debug_info)',  'null',          dbg === null ? 'null' : typeof dbg, dbg === null);
            rep('WebGL', 'dbgNotInList', 'debug_info in extensions',  'absent',
                exts.includes('WEBGL_debug_renderer_info') ? 'present' : 'absent',
                !exts.includes('WEBGL_debug_renderer_info'));
        } else {
            rep('WebGL', 'renderer', 'WebGL context', 'available', 'unavailable', false);
        }
    } catch (e) { rep('WebGL', 'renderer', 'WebGL tests', 'ok', 'error: ' + e.message, false); }

    // Timezone
    try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        rep('Timezone', 'timeZone', 'resolvedOptions().timeZone', 'America/Los_Angeles', tz, tz === 'America/Los_Angeles');
    } catch (e) { rep('Timezone', 'timeZone', 'resolvedOptions().timeZone', 'America/Los_Angeles', 'error', false); }

    const off = new Date().getTimezoneOffset();
    rep('Timezone', 'tzOffset', 'getTimezoneOffset()', '480', off, off === 480);

    // Performance.now precision
    try {
        const t = performance.now();
        const rounded = Math.abs(Math.round(t * 10) / 10 - t) < 0.0011;
        rep('Timing', 'perfNow', 'performance.now() granularity', '\u00b10.1ms', t.toFixed(4) + 'ms', rounded);
    } catch (e) { rep('Timing', 'perfNow', 'performance.now() granularity', '\u00b10.1ms', 'error', false); }

    // Math noise
    const sinExact  = 0.8414709848078965;
    const sinActual = Math.sin(1);
    rep('Math', 'sinNoise', 'Math.sin(1) \u2260 exact', '\u2260 IEEE754', sinActual.toPrecision(16), sinActual !== sinExact);

    // Speech synthesis
    try {
        const voices = speechSynthesis.getVoices();
        rep('Speech', 'getVoices', 'getVoices().length', '0', voices.length, voices.length === 0);
    } catch (e) { rep('Speech', 'getVoices', 'getVoices().length', '0', 'error', false); }

    // matchMedia
    try {
        const dark    = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const forced  = window.matchMedia('(forced-colors: active)').matches;
        const anyPtr  = window.matchMedia('(any-pointer: coarse)').matches;
        rep('Media', 'prefDark',  '(prefers-color-scheme: dark)',  'false', dark,   dark   === false);
        rep('Media', 'forcedCol', '(forced-colors: active)',       'false', forced, forced === false);
        rep('Media', 'anyCoarse', '(any-pointer: coarse)',         'false', anyPtr, anyPtr === false);
    } catch (e) { rep('Media', 'prefDark', 'matchMedia tests', 'ok', 'error', false); }

    // window.chrome
    try {
        const isStub = typeof window.chrome !== 'undefined'
            && Object.keys(window.chrome).length === 1
            && 'runtime' in window.chrome
            && Object.keys(window.chrome.runtime).length === 0;
        rep('Chrome', 'stub', 'window.chrome shape', '{runtime:{}}',
            JSON.stringify(window.chrome).substring(0, 30), isStub);
    } catch (e) { rep('Chrome', 'stub', 'window.chrome shape', '{runtime:{}}', 'error', false); }

    // RTCRtpSender.getCapabilities
    try {
        if (typeof RTCRtpSender !== 'undefined') {
            const caps = RTCRtpSender.getCapabilities('audio');
            const fixed = caps && Array.isArray(caps.codecs) && caps.codecs.length <= 6
                && caps.codecs.some(function(c) { return c.mimeType === 'audio/opus'; });
            rep('WebRTC', 'getCapabilities', 'getCapabilities(audio)', '\u22646 generic codecs',
                caps ? caps.codecs.length + ' codecs' : 'null', Boolean(fixed));
        } else {
            rep('WebRTC', 'getCapabilities', 'getCapabilities(audio)', '\u22646 generic codecs', 'no RTCRtpSender', false);
        }
    } catch (e) { rep('WebRTC', 'getCapabilities', 'getCapabilities(audio)', '\u22646 generic codecs', 'error', false); }

    // ── Async tests ──────────────────────────────────────────────────────────
    pend('Audio',   'audioZeroed',   'OfflineAudioContext result',  'all zeros');
    pend('Battery', 'batteryReject', 'navigator.getBattery()',      'rejected');
    pend('Geo',     'geoFixed',      'getCurrentPosition lat/lng',  '37.7988,-122.3984');

    // Audio fingerprint (async)
    ;(async function () {
        try {
            const oac = new OfflineAudioContext(1, 256, 44100);
            const osc  = oac.createOscillator();
            const comp = oac.createDynamicsCompressor();
            osc.connect(comp); comp.connect(oac.destination); osc.start(0);
            const buf  = await oac.startRendering();
            const data = buf.getChannelData(0);
            const allZ = data.every(function(v) { return v === 0; });
            const peak = Math.max.apply(null, Array.prototype.slice.call(data)).toFixed(5);
            upsert('audioZeroed', 'Audio', 'OfflineAudioContext result', 'all zeros',
                allZ ? 'all zeros' : 'peak=' + peak, allZ ? 'pass' : 'fail');
            console.log('PRIV|Audio|audioZeroed|all zeros|' + (allZ ? 'all zeros' : 'has data') + '|' + (allZ ? 'PASS' : 'FAIL'));
        } catch (e) {
            upsert('audioZeroed', 'Audio', 'OfflineAudioContext result', 'all zeros', 'error: ' + e.message, 'fail');
            console.log('PRIV|Audio|audioZeroed|all zeros|error|FAIL');
        }
    })();

    // Battery (async)
    if (typeof navigator.getBattery === 'function') {
        navigator.getBattery().then(
            function ()  {
                upsert('batteryReject', 'Battery', 'navigator.getBattery()', 'rejected', 'resolved (not rejected)', 'fail');
                console.log('PRIV|Battery|batteryReject|rejected|resolved|FAIL');
            },
            function ()  {
                upsert('batteryReject', 'Battery', 'navigator.getBattery()', 'rejected', 'rejected \u2713', 'pass');
                console.log('PRIV|Battery|batteryReject|rejected|rejected|PASS');
            }
        );
    } else {
        upsert('batteryReject', 'Battery', 'navigator.getBattery()', 'rejected', 'API absent \u2713', 'pass');
        console.log('PRIV|Battery|batteryReject|rejected|absent|PASS');
    }

    // Geolocation (async)
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                var isLL = Math.abs(lat - 37.7988) < 0.001 && Math.abs(lng + 122.3984) < 0.001;
                upsert('geoFixed', 'Geo', 'getCurrentPosition lat/lng', '37.7988,-122.3984',
                    lat.toFixed(4) + ', ' + lng.toFixed(4), isLL ? 'pass' : 'fail');
                console.log('PRIV|Geo|geoFixed|37.7988,-122.3984|' + lat.toFixed(4) + ',' + lng.toFixed(4) + '|' + (isLL ? 'PASS' : 'FAIL'));
            },
            function () {
                upsert('geoFixed', 'Geo', 'getCurrentPosition lat/lng', '37.7988,-122.3984', 'denied', 'fail');
                console.log('PRIV|Geo|geoFixed|37.7988,-122.3984|denied|FAIL');
            }
        );
    } else {
        upsert('geoFixed', 'Geo', 'getCurrentPosition lat/lng', '37.7988,-122.3984', 'unavailable', 'fail');
        console.log('PRIV|Geo|geoFixed|37.7988,-122.3984|unavailable|FAIL');
    }
}

window.addEventListener('DOMContentLoaded', runTests);
</script>
</body>
</html>
